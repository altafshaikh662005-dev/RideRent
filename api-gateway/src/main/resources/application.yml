server:
  port: 8085
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: users
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: bookings
          uri: http://localhost:8082
          predicates:
            - Path=/api/bookings/**
jwt:
  secret: ${JWT_SECRET}
rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:10}
