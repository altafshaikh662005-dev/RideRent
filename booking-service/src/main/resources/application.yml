server:
  port: 8082
spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:mysql://localhost:3306/booking_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
user-service:
  url: ${USER_SERVICE_URL:http://localhost:8081}
jwt:
  secret: ${JWT_SECRET}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
